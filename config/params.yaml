# Single config for the whole stack:
# - `chat_bridge_node:` -> our bridge (topics, action, prompt text, memory)
# - `motion_server_node:` -> robot address for the motion qi session
# - `stt_feeder_node:`  -> voice input (topics, action, echo-gate timing)
# - `/**:`             -> llama_node (model, context, CPU, chat template)
#   (`/**` applies to every node, so the model block works regardless of
#   the namespace llama_node is launched in.)
chat_bridge_node:
  ros__parameters:
    prompt_topic: "/prompt"
    speech_topic: "/speech"
    llama_action: "/naoqi_driver/generate_chat_completions"
    system_prompt: "Jesteś humanoidalnym robotem NAO. Odpowiadaj po polsku, maks. 2 zdania, bez markdown. Wejście może być bełkotem z rozpoznawania mowy: jeśli nie rozumiesz, odpowiedz samym speak z prośbą o powtórzenie i nie dodawaj żadnych kroków ruchowych. Kroki ruchowe dodawaj wyłącznie na wyraźną prośbę o konkretny ruch. Odpowiedź to pojedynczy obiekt JSON {\"actions\": [kroki]}. Kroki wykonują się po kolei: {\"name\": \"speak\", \"text\": \"<tekst>\"} mówi (zawsze zacznij od speak z niepustym text), pozostałe nazwy to ruchy. Tylko JSON, nic poza tym."
    temp: 0.2
    server_wait_sec: 5.0
    # Empty = resolve share/nao_agent/config/grammar/response.json.
    response_schema_file: ""
    motion_service: "/nao_agent/go_to_posture"
    # Thinking-eyes animation while the LLM works (false = disable).
    thinking_eyes: true
    eyes_service: "/nao_agent/set_eyes"
    # Busy flag for the STT feeder: true while a prompt is processed.
    busy_topic: "/agent/busy"
    # Conversation memory: last N exchanges, each message clipped to M chars.
    history_turns: 6
    history_msg_chars: 500

motion_server_node:
  ros__parameters:
    # Robot address for the motion qi session (launch also passes these,
    # launch values win).
    nao_ip: "127.0.0.1"
    nao_port: 9559

stt_feeder_node:
  ros__parameters:
    audio_topic: "/audio"
    stamped_topic: "/audio/in"
    stt_action: "/whisper/listen"
    prompt_topic: "/prompt"
    speech_topic: "/speech"
    busy_topic: "/agent/busy"
    eyes_service: "/nao_agent/set_eyes"
    # Echo-gate timing: assumed seconds per spoken char + safety margin.
    sec_per_char: 0.08
    gate_margin_sec: 2.0
    server_wait_sec: 5.0
    retry_sec: 2.0

/**:
  ros__parameters:
    # Model parameters (Polish-first: Bielik-7B-Instruct, Mistral-based)
    model:
      repo: speakleash/Bielik-7B-Instruct-v0.1-GGUF
      filename: bielik-7b-instruct-v0.1.Q4_K_M.gguf

    # Context / inference parameters
    context:
      n_ctx: 2048
      n_batch: 8
      n_predict: 2048

    # GPU / backend parameters
    gpu:
      n_gpu_layers: 0

    # CPU parameters (tuned: 7B needs more than the upstream single thread)
    cpu:
      n_threads: 4

    # Prompt & chat parameters (must match the model chat template:
    # Bielik uses [INST]...[/INST]).
    # prefix/suffix are single spaces on purpose: any non-empty value takes
    # precedence over prompts/Mistral.yaml, so the Jinja-rendered prompt
    # (which already contains [INST] markers) is not wrapped in a second
    # pair — that malformed doubling is what made the model emit a leading
    # <s> (BOS token leaking into the detokenized answer).
    prompt:
      system_prompt_type: Mistral
      prefix: " "
      suffix: " "
