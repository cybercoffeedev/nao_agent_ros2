# Production CUDA composition (GPU inference for llama + whisper).
# Same contract as production.compose.yml, plus GPU reservation.
# Host prerequisites: NVIDIA driver + nvidia-container-toolkit.
# (Podman: replace `deploy:` below with its CDI device syntax —
#  `devices: ["nvidia.com/gpu=all"]` on the service.)
#
#   cp .env.example .env   # fill in NAO_IP, never commit .env
#   docker compose -f .devops/production-cuda.compose.yml --project-directory .devops up -d --build
#
# Same deployment rules as the CPU file: host network (robot calls back
# into the driver), exactly one stack per robot IP, NAO_IP required.

services:
  nao_stack:
    build:
      context: ..
      dockerfile: .devops/production-cuda.containerfile
      args:
        # 99 = offload all layers; lower it on small VRAM.
        LLAMA_GPU_LAYERS: 99
        WHISPER_GPU: true
    image: nao_agent:prod-cuda
    container_name: nao_agent_prod_cuda
    network_mode: host
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      ros2 launch nao_agent bringup.launch.py
      nao_ip:=${NAO_IP:?set NAO_IP in .devops/.env}
      nao_port:=${NAO_PORT:-9559}
    volumes:
      - hf-cache:/root/.cache/huggingface
      - whisper-models:/root/.cache/whisper
      - ros-logs:/root/.ros/log
    stop_grace_period: 30s

volumes:
  hf-cache:
  whisper-models:
  ros-logs:
