# Whisper STT params (Polish, CPU-only, model from HuggingFace Hub).
# NOTE: kept in this separate file (not params.yaml) on purpose: that file
# carries a `/**:` block for llama_ros, which would shadow these blocks
# (same `model.*` keys) when passed to the namespaced whisper nodes.
/whisper/whisper_node:
  ros__parameters:
    model:
      # Legacy .bin: the vendored whisper.cpp rejects GGUF (bad magic).
      repo: "ggerganov/whisper.cpp"
      filename: "ggml-base.bin"
    transcription:
      language: "pl"
      n_threads: 4
    gpu:
      enabled: false

/whisper/silero_vad_node:
  ros__parameters:
    # Self-sufficient block (mirrors upstream defaults): silero is launched
    # with this file alone, so the model location must be here as well.
    model_repo: "mgonzs13/silero-vad-onnx"
    model_filename: "silero_vad.onnx"
    model_path: ""
    sample_rate: 16000
    frame_size_ms: 32
    # VAD sensitivity; tune on the physical robot (fan/servo noise).
    # 0.5 fired on AC noise, 0.65 heard nothing: middle ground.
    threshold: 0.6
    min_silence_ms: 128
    speech_pad_ms: 32
    use_cuda: false
